version: 2
updates:
  # Python dependencies — uv workspace (root + workspace packages)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # All runtime/production deps batch into one PR. Catch-all so newly
      # added deps (e.g. typer, pyjwt) are grouped automatically instead of
      # each opening its own PR.
      python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "ruff"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # Docker base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
