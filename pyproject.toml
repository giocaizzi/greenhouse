[project]
name = "greenhouse"
version = "5.0.1"
description = "Smart irrigation system with evidence-based plant care and trend analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kezclaw", email = "kezclaw@gmail.com"}
]
keywords = ["irrigation", "smart-home", "tuya", "plant-care", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "greenhouse-core",
    "greenhouse-server",
    "greenhouse-cli",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
greenhouse-core = { workspace = true }
greenhouse-server = { workspace = true }
greenhouse-cli = { workspace = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.19",
    "time-machine>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs/greenhouse-core", "libs/greenhouse-server", "libs/greenhouse-cli", "tests"]

[tool.mypy]
# Strict ratchet (refactor plan T0.4 / target §10.13, §11). No `files` key: `make typecheck`
# checks the modules listed in refactor/mypy-strict.txt (append-only).
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
# The workspace packages ship no py.typed, so without this their imports resolve through the
# editable .pth files as "missing" and silently become Any. Source paths make them typed.
mypy_path = ["libs/greenhouse-core", "libs/greenhouse-server", "libs/greenhouse-cli"]

[[tool.mypy.overrides]]
# Framework-boundary profile: FastAPI route / Typer command signatures are introspected
# (OpenAPI, response_model inference, --help) and are never edited; helpers stay fully typed.
module = [
    "greenhouse_server.routes.*",
    "greenhouse_server.web.routes.*",
    "greenhouse_cli.commands.*",
    "greenhouse_cli.main",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["libs/greenhouse-core", "libs/greenhouse-server", "libs/greenhouse-cli", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
# Complexity ratchet (refactor plan T0.3 / target §11): today's offenders are listed in
# per-file-ignores below; the integrator removes each entry once its file is clean (I1).
extend-select = [
    "C90", "PLR0911", "PLR0912", "PLR0915",
    "ERA",  # eradicate: commented-out code
    "PGH",  # pygrep-hooks: blanket noqa / type: ignore without codes
    "SLF",  # flake8-self: private member access across objects
    "PLE",  # pylint errors
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["B011"]  # assert False check
"scripts/*" = ["E402"]  # intentional sys.path before import
"tests/**" = ["C90", "PLR0911", "PLR0912", "PLR0915", "ERA001", "SLF001"]  # frozen safety net: exceeds limits, pokes privates
"refactor/**" = ["C90", "PLR0911", "PLR0912", "PLR0915"]  # refactor tooling scripts, not shipped code
# Complexity offenders at max-complexity 8 (baseline refactor-gate1); only shrinks.
"libs/greenhouse-cli/greenhouse_cli/commands/auth.py" = ["C901"]
"libs/greenhouse-cli/greenhouse_cli/commands/operations.py" = ["C901", "PLR0915"]
"libs/greenhouse-cli/greenhouse_cli/tui/model.py" = ["C901"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/cluster.py" = ["C901", "PLR0912"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/forms.py" = ["C901", "PLR0911"]
"libs/greenhouse-cli/greenhouse_cli/tui/widgets.py" = ["C901"]
"libs/greenhouse-core/greenhouse_core/devices/irrigators/ik10pw.py" = ["C901", "PLR0911"]
"libs/greenhouse-core/greenhouse_core/devices/irrigators/tuya_generic.py" = ["C901"]
"libs/greenhouse-core/greenhouse_core/learning/issues.py" = ["C901", "PLR0912", "PLR0915"]
"libs/greenhouse-core/greenhouse_core/logic/engine.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"libs/greenhouse-core/greenhouse_core/logic/sensors.py" = ["C901"]
"libs/greenhouse-core/greenhouse_core/logic/stress.py" = ["C901", "PLR0912"]
"libs/greenhouse-core/greenhouse_core/logic/trends.py" = ["C901", "PLR0912"]
"libs/greenhouse-core/greenhouse_core/stats.py" = ["C901"]
"libs/greenhouse-server/greenhouse_server/services/health_monitor.py" = ["PLR0911"]
"libs/greenhouse-server/greenhouse_server/services/irrigation.py" = ["C901", "PLR0911", "PLR0915"]

[tool.importlinter]
root_packages = ["greenhouse_core", "greenhouse_server", "greenhouse_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CLI is HTTP-only"
type = "forbidden"
source_modules = ["greenhouse_cli"]
forbidden_modules = ["greenhouse_core", "greenhouse_server", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "Core never imports server or CLI"
type = "forbidden"
source_modules = ["greenhouse_core"]
forbidden_modules = ["greenhouse_server", "greenhouse_cli"]

[[tool.importlinter.contracts]]
name = "Server layers: app > routes|web > deps|auth > scheduler > services > config"
type = "layers"
layers = [
  "greenhouse_server.app",
  "greenhouse_server.routes | greenhouse_server.web",
  "greenhouse_server.deps | greenhouse_server.auth",
  "greenhouse_server.scheduler",
  "greenhouse_server.services",
  "greenhouse_server.config",
]
ignore_imports = [
  "greenhouse_server.services.irrigation -> greenhouse_server.scheduler",     # lazy; _app trap (§6)
  "greenhouse_server.services.system_health -> greenhouse_server.scheduler",
]

[[tool.importlinter.contracts]]
name = "API routes and web routes are independent"
type = "independence"
modules = ["greenhouse_server.routes", "greenhouse_server.web"]

[[tool.importlinter.contracts]]
name = "Devices do not depend on decision logic, learning or persistence"
type = "forbidden"
source_modules = ["greenhouse_core.devices"]
forbidden_modules = ["greenhouse_core.logic", "greenhouse_core.learning", "greenhouse_core.repository",
                     "greenhouse_core.schemas", "greenhouse_core.sync"]

[[tool.importlinter.contracts]]
name = "Data definitions stay below behaviour"
type = "forbidden"
source_modules = ["greenhouse_core.models", "greenhouse_core.schemas", "greenhouse_core.constants"]
forbidden_modules = ["greenhouse_core.logic", "greenhouse_core.learning", "greenhouse_core.repository",
                     "greenhouse_core.devices", "greenhouse_core.sync"]

[[tool.importlinter.contracts]]
name = "Learning builds on logic; engine's advisory hook is the only way back"
type = "layers"
layers = ["greenhouse_core.learning", "greenhouse_core.logic"]
ignore_imports = ["greenhouse_core.logic.engine -> greenhouse_core.learning"]

[[tool.importlinter.contracts]]
name = "Inside logic: engine orchestrates; helpers/values never import it"
type = "layers"
layers = [
  "greenhouse_core.logic.engine",
  "greenhouse_core.logic.fallback | greenhouse_core.logic.sensors | greenhouse_core.logic.stress | greenhouse_core.logic.trends",
  "greenhouse_core.logic.timing | greenhouse_core.logic.cleaning | greenhouse_core.logic.plant_needs",
  "greenhouse_core.logic.decision",
]

[[tool.importlinter.contracts]]
name = "Logic never drives devices"
type = "forbidden"
source_modules = ["greenhouse_core.logic"]
forbidden_modules = ["greenhouse_core.devices", "greenhouse_core.sync"]

[[tool.importlinter.contracts]]
name = "TUI view-model modules stay widget-free and I/O-free"
type = "forbidden"
source_modules = ["greenhouse_cli.tui.model", "greenhouse_cli.tui.formatting"]
forbidden_modules = ["textual", "greenhouse_cli.tui.screens", "greenhouse_cli.tui.widgets", "greenhouse_cli.client", "httpx"]
