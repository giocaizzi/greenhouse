[project]
name = "tuya-irrigation"
version = "1.0.0"
description = "Smart irrigation system with evidence-based plant care and trend analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kezclaw", email = "kezclaw@gmail.com"}
]
keywords = ["irrigation", "smart-home", "tuya", "plant-care", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tuya-irrigation-core",
    "tuya-irrigation-server",
    "tuya-irrigation-cli",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
tuya-irrigation-core = { workspace = true }
tuya-irrigation-server = { workspace = true }
tuya-irrigation-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs/tuya-irrigation-core", "libs/tuya-irrigation-server", "libs/tuya-irrigation-cli", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["libs/tuya-irrigation-core", "libs/tuya-irrigation-server", "libs/tuya-irrigation-cli", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["B011"]  # assert False check
"scripts/*" = ["E402"]  # intentional sys.path before import
