[project]
name = "greenhouse"
version = "5.0.1"
description = "Smart irrigation system with evidence-based plant care and trend analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kezclaw", email = "kezclaw@gmail.com"}
]
keywords = ["irrigation", "smart-home", "tuya", "plant-care", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "greenhouse-core",
    "greenhouse-server",
    "greenhouse-cli",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
greenhouse-core = { workspace = true }
greenhouse-server = { workspace = true }
greenhouse-cli = { workspace = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.19",
    "time-machine>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs/greenhouse-core", "libs/greenhouse-server", "libs/greenhouse-cli", "tests"]

[tool.mypy]
# Strict ratchet (refactor plan T0.4 / target §10.13, §11). No `files` key: `make typecheck`
# checks the modules listed in refactor/mypy-strict.txt (append-only).
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
# The workspace packages ship no py.typed, so without this their imports resolve through the
# editable .pth files as "missing" and silently become Any. Source paths make them typed.
mypy_path = ["libs/greenhouse-core", "libs/greenhouse-server", "libs/greenhouse-cli"]

[[tool.mypy.overrides]]
# Framework-boundary profile for the Typer commands: their signatures are introspected
# (--help) and are never edited; helpers stay fully typed. (Server routes are fully strict.)
module = [
    "greenhouse_cli.commands.*",
    "greenhouse_cli.main",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["libs/greenhouse-core", "libs/greenhouse-server", "libs/greenhouse-cli", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
# Lint ratchet (refactor/40-lint-ratchet.md): every family below is enforced; today's offenders are
# listed per file in per-file-ignores and the integrator removes each entry once its file is clean.
# Not adopted, on purpose: COM812 (conflicts with ruff format), ANN (redundant with the mypy strict
# ratchet), TC (moves imports under TYPE_CHECKING and breaks FastAPI / Typer / Pydantic runtime
# annotations — typing review), FAST001 (removes response_model: CLAUDE.md invariant 7), FAST002 (only
# with OpenAPI/MCP golden proof), PYI041 on schemas (changes the OpenAPI schema), DTZ and TRY other than
# TRY003 (report-only: timezone / exception-handling semantics), PLW0717 (preview, report-only),
# INP001 (would change packaging), PLC0415 (lazy imports are deliberate).
extend-select = [
    # complexity / size (sizecheck.py is the authority on body lines and file length)
    "C90", "PLR0911", "PLR0912", "PLR0915",
    "PLR0916",  # too-many-boolean-expressions
    "PLR1702",  # too-many-nested-blocks (preview, explicit) — agrees with sizecheck's nesting check
    "PLR0914",  # too-many-locals (preview, explicit)
    "PLR0904",  # too-many-public-methods (preview, explicit)
    "PLR0913",  # too-many-arguments (frozen handler signatures excluded per directory)
    "PLR0917",  # too-many-positional-arguments (preview, explicit; same exclusions)
    # mechanical, behaviour-neutral
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PERF",  # perflint
    "PIE",  # flake8-pie
    "RSE",  # flake8-raise
    "FURB",  # refurb
    "N",  # pep8-naming
    "EXE",  # flake8-executable
    "RUF",  # ruff-specific (RUF001 / RUF002 ignored, see below)
    "PLR2004",  # magic-value-comparison: thresholds live in constants.py (CLAUDE.md invariant 5)
    "EM",  # exception message literals bound to `msg` first (message text unchanged)
    "TRY003",  # long messages outside the exception class
    # signatures (frozen handlers excluded per directory)
    "FBT",  # boolean traps (Typer --flag options are the CLI contract)
    "ARG",  # unused arguments (FastAPI web handlers keep `request`)
    "A002",  # builtin-argument-shadowing (`id` / `type` options and form fields)
    # docs, security, hygiene
    "D",  # pydocstyle, google convention (D105 / D107 ignored)
    "S",  # flake8-bandit: intended uses carry a reasoned noqa; real findings → REFACTOR_NOTES
    "BLE",  # blind except — a lock: existing sites carry noqa (WP8 files: per-file), never rewritten
    "T201",  # print: libs/ output goes through typer.echo / rich / logging
    "PLW",  # pylint warnings
    "ERA",  # eradicate: commented-out code
    "PGH",  # pygrep-hooks: blanket noqa / type: ignore without codes
    "SLF",  # flake8-self: private member access across objects
    "PLE",  # pylint errors
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults
    "RUF001",  # ambiguous unicode in strings: frozen user-facing output (–, —, ×, …)
    "RUF002",  # ambiguous unicode in docstrings: allowed by the owner (route docstrings are MCP text)
    "D105",  # magic methods: their meaning is the protocol's
    "D107",  # __init__: the class docstring documents construction
    "PLW0603",  # global statement: deliberate — per-app scheduler `_app`, display tz, plant-DB singleton
]
# Preview rules are opt-in one by one: with explicit-preview-rules only the preview codes listed by full
# name activate. Measured at step 0: 0 extra findings on the stable rules then selected. Preview does refine
# two stable rules adopted later: BLE001 skips handlers that log the exception or re-raise, S310 skips
# literal http(s) URLs. Preview rules may change between ruff releases — the version is pinned in uv.lock
# and .pre-commit-config.yaml.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
# 23 statements best approximates the 40-body-line rule of refactor/scripts/sizecheck.py on today's
# libs/ code (measured over every function: 3 false positives, 1 false negative; 22 → 8 errors, 24 → 6).
max-statements = 23
max-nested-blocks = 3

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["B011"]  # assert False check
"scripts/*" = ["E402"]  # intentional sys.path before import
# Frozen safety net: tests exceed size limits and poke privates; never edited to satisfy a lint rule.
"tests/**" = [
    "C90", "PLR0911", "PLR0912", "PLR0915", "PLR0904", "PLR0913", "PLR0914", "PLR0917", "PLR1702", "PLR2004",
    "SIM", "RET", "PTH", "PERF", "PLW", "FURB", "N", "RUF", "EM", "TRY003",
    "FBT", "ARG", "D", "S", "BLE", "ERA001", "SLF001",
]
# Refactor tooling scripts (not shipped; the folder is dropped at the end, sizecheck moves to scripts/).
"refactor/**" = [
    "C90", "PLR0911", "PLR0912", "PLR0915", "PLR0914", "PLR1702", "PLR2004",
    "PERF", "PLW", "RUF005", "EM", "TRY003", "FBT", "D", "S", "T201",
]
"libs/greenhouse-core/greenhouse_core/migrations/versions/*" = ["D", "PLR0915"]  # generated Alembic DDL, out of scope
# Frozen handler signatures (not a ratchet): FastAPI API/web handlers and Typer commands declare one
# parameter per query/form field or CLI option (the OpenAPI / MCP / --help contract), and web pages
# keep `request: Request` even when unused.
# D417: route docstrings document request parameters only, never framework-level dependencies such as
# `repo` / services / settings (CLAUDE.md invariant 7) — the docstring is the MCP tool description.
"libs/greenhouse-server/greenhouse_server/routes/*" = ["D417", "PLR0913", "PLR0917"]
"libs/greenhouse-server/greenhouse_server/web/routes/*" = ["A002", "ARG001", "D417", "PLR0913", "PLR0917"]
"libs/greenhouse-cli/greenhouse_cli/commands/*" = ["A002", "FBT", "PLR0913", "PLR0917"]
# Ratchet offenders (baseline refactor-gate1 + lint ratchet, refactor/40-lint-ratchet.md); each list only shrinks.
"libs/greenhouse-cli/greenhouse_cli/client.py" = ["FBT001", "FBT002", "PLR0904", "PLR0913", "PLR0917"]
"libs/greenhouse-cli/greenhouse_cli/commands/auth.py" = ["PLR0915"]
"libs/greenhouse-cli/greenhouse_cli/commands/operations.py" = ["C901", "PLR0915"]
"libs/greenhouse-cli/greenhouse_cli/tui/__init__.py" = ["FBT001", "FBT002"]
"libs/greenhouse-cli/greenhouse_cli/tui/app.py" = ["FBT001", "FBT002"]
"libs/greenhouse-cli/greenhouse_cli/tui/formatting.py" = ["FBT001", "FBT002"]
"libs/greenhouse-cli/greenhouse_cli/tui/render.py" = ["FBT001", "FBT003"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/alerts.py" = ["FBT003"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/base.py" = ["FBT001", "PLR0913", "PLR0917"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/cluster.py" = ["FBT001", "FBT003", "PLR0904", "PLR0915", "PLR1702"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/forms.py" = ["C901", "PLR0911", "PLR0912", "PLR1702"]
"libs/greenhouse-cli/greenhouse_cli/tui/screens/modals.py" = ["FBT001", "FBT002"]
"libs/greenhouse-cli/greenhouse_cli/tui/sprites.py" = ["FBT001", "FBT002"]
"libs/greenhouse-cli/greenhouse_cli/tui/widgets.py" = ["FBT001", "FBT002", "PLR0913", "PLR0915", "PLR0917"]
"libs/greenhouse-core/greenhouse_core/devices/__init__.py" = ["RUF022"]
"libs/greenhouse-core/greenhouse_core/devices/gateway.py" = ["BLE001", "EM101", "EM102", "PLR0915", "TRY003"]
"libs/greenhouse-core/greenhouse_core/devices/irrigators/ik10pw.py" = ["BLE001", "C901", "PLR0911", "PLR0915", "PLR1702", "RUF022", "S110", "SIM105"]
"libs/greenhouse-core/greenhouse_core/devices/irrigators/tuya_generic.py" = ["ARG002", "BLE001", "C901", "FBT001", "FBT003", "PLR0912", "PLR1702", "S110"]
"libs/greenhouse-core/greenhouse_core/devices/profile.py" = ["D205"]
"libs/greenhouse-core/greenhouse_core/devices/registry.py" = ["D102", "EM102", "N818", "TRY003"]  # UnknownDeviceModel: public name (WP8-owned file)
"libs/greenhouse-core/greenhouse_core/devices/sensors/tr301z.py" = ["ARG002", "RUF022"]
"libs/greenhouse-core/greenhouse_core/devices/sensors/tuya_generic.py" = ["ARG002", "BLE001"]
"libs/greenhouse-core/greenhouse_core/logic/decision.py" = ["PLR0913"]
"libs/greenhouse-core/greenhouse_core/logic/engine.py" = ["ARG002", "C901", "D205", "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR2004", "RUF003", "RUF046"]
"libs/greenhouse-core/greenhouse_core/logic/fallback.py" = ["PLR0913"]
"libs/greenhouse-core/greenhouse_core/logic/timing.py" = ["SIM102"]
"libs/greenhouse-core/greenhouse_core/repository.py" = ["FBT001", "FBT002", "PLR0904", "PLR0913", "PLR0917"]
"libs/greenhouse-core/greenhouse_core/sync.py" = ["BLE001", "D202", "EXE002", "PLR0915", "PLR1702", "S110", "SIM108"]  # EXE002: stray +x bit, WP8-owned
"libs/greenhouse-server/greenhouse_server/config.py" = ["D101"]
"libs/greenhouse-server/greenhouse_server/deps.py" = ["PLR0913", "PLR0917"]
"libs/greenhouse-server/greenhouse_server/routes/scheduler.py" = ["FBT001", "FBT003"]
"libs/greenhouse-server/greenhouse_server/scheduler.py" = ["FBT001", "FBT003"]
"libs/greenhouse-server/greenhouse_server/services/alerts.py" = ["PLR0913"]
"libs/greenhouse-server/greenhouse_server/services/bulk.py" = ["PLR1702"]
"libs/greenhouse-server/greenhouse_server/services/forecast.py" = ["PLR0914"]
"libs/greenhouse-server/greenhouse_server/services/health_monitor.py" = ["PLR0911", "PLR0913"]
"libs/greenhouse-server/greenhouse_server/services/inventory.py" = ["PLR0913"]
"libs/greenhouse-server/greenhouse_server/services/irrigation.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
"libs/greenhouse-server/greenhouse_server/services/manual_control.py" = ["PLR0913"]
"libs/greenhouse-server/greenhouse_server/services/pump_watcher.py" = ["PLR0913", "PLR0915"]
"libs/greenhouse-server/greenhouse_server/services/system_health.py" = ["FBT001"]
"libs/greenhouse-server/greenhouse_server/web/filters.py" = ["PLR0912"]
"libs/greenhouse-server/greenhouse_server/web/routes/analytics.py" = ["FBT001", "FBT003"]

[tool.importlinter]
root_packages = ["greenhouse_core", "greenhouse_server", "greenhouse_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CLI is HTTP-only"
type = "forbidden"
source_modules = ["greenhouse_cli"]
forbidden_modules = ["greenhouse_core", "greenhouse_server", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "Core never imports server or CLI"
type = "forbidden"
source_modules = ["greenhouse_core"]
forbidden_modules = ["greenhouse_server", "greenhouse_cli"]

[[tool.importlinter.contracts]]
name = "Server layers: app > routes|web > deps|auth > scheduler > state > services > config"
type = "layers"
layers = [
  "greenhouse_server.app",
  "greenhouse_server.routes | greenhouse_server.web",
  "greenhouse_server.deps | greenhouse_server.auth",
  "greenhouse_server.scheduler",
  "greenhouse_server.state",
  "greenhouse_server.services",
  "greenhouse_server.config",
]
ignore_imports = [
  "greenhouse_server.services.irrigation -> greenhouse_server.scheduler",       # lazy: pump-watcher scheduling reads _app at call time
  "greenhouse_server.services.irrigation_jobs -> greenhouse_server.scheduler",  # lazy: leak-check jobs read _app at call time
  "greenhouse_server.services.system_health -> greenhouse_server.scheduler",
]

[[tool.importlinter.contracts]]
name = "API routes and web routes are independent"
type = "independence"
modules = ["greenhouse_server.routes", "greenhouse_server.web"]

[[tool.importlinter.contracts]]
name = "Devices do not depend on decision logic, learning or persistence"
type = "forbidden"
source_modules = ["greenhouse_core.devices"]
forbidden_modules = ["greenhouse_core.logic", "greenhouse_core.learning", "greenhouse_core.repository",
                     "greenhouse_core.schemas", "greenhouse_core.sync"]

[[tool.importlinter.contracts]]
name = "Data definitions stay below behaviour"
type = "forbidden"
source_modules = ["greenhouse_core.models", "greenhouse_core.schemas", "greenhouse_core.constants"]
forbidden_modules = ["greenhouse_core.logic", "greenhouse_core.learning", "greenhouse_core.repository",
                     "greenhouse_core.devices", "greenhouse_core.sync"]

[[tool.importlinter.contracts]]
name = "Learning builds on logic; engine's advisory hook is the only way back"
type = "layers"
layers = ["greenhouse_core.learning", "greenhouse_core.logic"]
ignore_imports = ["greenhouse_core.logic.engine -> greenhouse_core.learning"]

[[tool.importlinter.contracts]]
name = "Inside logic: engine orchestrates; helpers/values never import it"
type = "layers"
layers = [
  "greenhouse_core.logic.engine",
  "greenhouse_core.logic.fallback | greenhouse_core.logic.sensors | greenhouse_core.logic.stress | greenhouse_core.logic.trends",
  "greenhouse_core.logic.timing | greenhouse_core.logic.cleaning | greenhouse_core.logic.plant_needs",
  "greenhouse_core.logic.decision",
]

[[tool.importlinter.contracts]]
name = "Logic never drives devices"
type = "forbidden"
source_modules = ["greenhouse_core.logic"]
forbidden_modules = ["greenhouse_core.devices", "greenhouse_core.sync"]

[[tool.importlinter.contracts]]
name = "TUI view-model modules stay widget-free and I/O-free"
type = "forbidden"
source_modules = ["greenhouse_cli.tui.model", "greenhouse_cli.tui.formatting", "greenhouse_cli.tui.render"]
forbidden_modules = ["textual", "greenhouse_cli.tui.screens", "greenhouse_cli.tui.widgets", "greenhouse_cli.client", "httpx"]

[[tool.importlinter.contracts]]
name = "CLI layers: main > commands > tui > client > constants"
type = "layers"
layers = ["greenhouse_cli.main", "greenhouse_cli.commands", "greenhouse_cli.tui", "greenhouse_cli.client", "greenhouse_cli.constants"]

[[tool.importlinter.contracts]]
name = "TUI layers: app > screens > widgets|render > model > formatting|sprites"
type = "layers"
layers = [
  "greenhouse_cli.tui.app",
  "greenhouse_cli.tui.screens",
  "greenhouse_cli.tui.widgets | greenhouse_cli.tui.render",
  "greenhouse_cli.tui.model",
  "greenhouse_cli.tui.formatting | greenhouse_cli.tui.sprites",
]
ignore_imports = [
  "greenhouse_cli.tui.screens.base -> greenhouse_cli.tui.app",    # TYPE_CHECKING only
  "greenhouse_cli.tui.screens.search -> greenhouse_cli.tui.app",  # TYPE_CHECKING only
]

[[tool.importlinter.contracts]]
name = "Web layers: router > routes|exception_handlers > context|templating > filters|weekdays|forms"
type = "layers"
layers = [
  "greenhouse_server.web.router",
  "greenhouse_server.web.routes | greenhouse_server.web.exception_handlers",
  "greenhouse_server.web.context | greenhouse_server.web.templating",
  "greenhouse_server.web.filters | greenhouse_server.web.weekdays | greenhouse_server.web.forms",
]

[[tool.importlinter.contracts]]
name = "API route modules are independent of each other"
type = "independence"
modules = ["greenhouse_server.routes.*"]

[[tool.importlinter.contracts]]
name = "Web route modules are independent of each other"
type = "independence"
modules = ["greenhouse_server.web.routes.*"]

[[tool.importlinter.contracts]]
name = "Services are HTTP-free (no FastAPI/Starlette, no request plumbing)"
type = "forbidden"
source_modules = ["greenhouse_server.services"]
forbidden_modules = ["fastapi", "starlette", "greenhouse_server.deps", "greenhouse_server.auth"]
allow_indirect_imports = true
ignore_imports = ["greenhouse_server.services.jobs -> fastapi"]  # TYPE_CHECKING annotation only

[[tool.importlinter.contracts]]
name = "SQLAlchemy stays behind the repository"
type = "forbidden"
source_modules = [
  "greenhouse_server.routes", "greenhouse_server.web", "greenhouse_server.services", "greenhouse_server.scheduler",
  "greenhouse_core.logic", "greenhouse_core.learning", "greenhouse_core.stats", "greenhouse_core.plant_db",
  "greenhouse_core.utils", "greenhouse_core.schemas", "greenhouse_core.constants",
]
forbidden_modules = ["sqlalchemy", "alembic", "greenhouse_core.database"]
allow_indirect_imports = true
ignore_imports = [
  "greenhouse_server.web.context -> sqlalchemy",        # TYPE_CHECKING annotation only
  "greenhouse_server.services.jobs -> sqlalchemy",  # TYPE_CHECKING annotation only
  "greenhouse_server.services.inventory -> sqlalchemy", # IntegrityError -> DeviceIdExistsError translation
]

[[tool.importlinter.contracts]]
name = "Persistence sits below domain behaviour"
type = "forbidden"
source_modules = ["greenhouse_core.repository", "greenhouse_core.database", "greenhouse_core.models", "greenhouse_core.auth"]
forbidden_modules = ["greenhouse_core.logic", "greenhouse_core.learning", "greenhouse_core.devices", "greenhouse_core.sync",
                     "greenhouse_core.plant_db", "greenhouse_core.stats", "greenhouse_core.utils", "greenhouse_core.schemas"]

[[tool.importlinter.contracts]]
name = "Only sync and server wiring touch devices"
type = "forbidden"
source_modules = ["greenhouse_core.learning", "greenhouse_core.stats", "greenhouse_core.plant_db", "greenhouse_core.utils",
                  "greenhouse_core.repository", "greenhouse_core.auth", "greenhouse_core.database"]
forbidden_modules = ["greenhouse_core.devices", "greenhouse_core.sync", "tinytuya"]

[[tool.importlinter.contracts]]
name = "Server config is a leaf"
type = "forbidden"
source_modules = ["greenhouse_server.config"]
forbidden_modules = ["greenhouse_core.repository", "greenhouse_core.models", "greenhouse_core.devices", "greenhouse_core.logic",
                     "greenhouse_core.learning", "greenhouse_core.sync", "sqlalchemy", "fastapi"]
