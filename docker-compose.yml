services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuya-irrigation-server:latest
    container_name: tuya-irrigation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IRRIGATION_DB_URL: sqlite:////app/data/irrigation.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/clusters', timeout=3).status < 500 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
