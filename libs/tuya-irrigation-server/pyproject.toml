[project]
name = "tuya-irrigation-server"
version = "1.0.0"
description = "FastAPI server for tuya-irrigation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "tuya-irrigation-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
tuya-irrigation-server = "tuya_irrigation_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tuya_irrigation_server"]
