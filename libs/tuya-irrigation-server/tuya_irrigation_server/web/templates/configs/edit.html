{% extends "_base.html" %}
{% block title %}Config · {{ cluster.name }}{% endblock %}
{% block content %}
<hgroup>
  <h1>Irrigation config</h1>
  <p><a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></p>
</hgroup>

<form method="post" action="/clusters/{{ cluster.id }}/config">
  <label for="mode">Mode
    <select id="mode" name="mode" required>
      {% set current_mode = config.mode if config else "smart" %}
      <option value="manual" {% if current_mode == "manual" %}selected{% endif %}>manual</option>
      <option value="schedule" {% if current_mode == "schedule" %}selected{% endif %}>schedule</option>
      <option value="smart" {% if current_mode == "smart" %}selected{% endif %}>smart</option>
    </select>
  </label>
  <div class="grid">
    <label for="duration_minutes">Duration (min)
      <input type="number" id="duration_minutes" name="duration_minutes" min="1" step="1"
             value="{{ config.duration_minutes if config and config.duration_minutes is not none else '' }}">
    </label>
    <label for="interval_hours">Interval (hours)
      <input type="number" id="interval_hours" name="interval_hours" min="1" step="1"
             value="{{ config.interval_hours if config and config.interval_hours is not none else '' }}">
    </label>
  </div>
  <label>
    <input type="checkbox" name="auto_run" value="on"
           {% if not config or config.auto_run %}checked{% endif %}>
    Auto-run enabled
  </label>
  <button type="submit">Save config</button>
  <a href="/clusters/{{ cluster.id }}" role="button" class="secondary">Cancel</a>
</form>
{% endblock %}
