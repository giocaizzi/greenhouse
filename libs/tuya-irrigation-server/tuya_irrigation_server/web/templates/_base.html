<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Tuya Irrigation{% endblock %}</title>

  <link rel="preload" href="/static/fonts/Geist[wght].woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/GeistMono[wght].woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">

  <script>
    // Early theme application — runs before body paint to avoid flash.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="container topbar__inner">
    <a href="/" class="brand" aria-label="Irrigation home">
      <span class="brand__mark"><svg class="icon"><use href="/static/icons/sprite.svg#i-leaf"></use></svg></span>
      Irrigation
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="/">Dashboard</a>
      <a href="/clusters">Clusters</a>
      <a href="/scheduler">Scheduler</a>
      <a href="/health">Health</a>
    </nav>
    <span class="topbar__spacer"></span>
    <button
      id="theme-toggle"
      class="icon-btn"
      type="button"
      aria-label="Toggle theme"
      title="Toggle theme"
      onclick="(function(){var h=document.documentElement;var cur=h.getAttribute('data-theme');var next=cur==='light'?'dark':(cur==='dark'?'light':(window.matchMedia('(prefers-color-scheme: light)').matches?'dark':'light'));h.setAttribute('data-theme',next);try{localStorage.setItem('theme',next);}catch(e){}if(window.__rerenderCharts){window.__rerenderCharts();}})()">
      <svg class="icon icon-moon" aria-hidden="true"><use href="/static/icons/sprite.svg#i-moon"></use></svg>
      <svg class="icon icon-sun" aria-hidden="true"><use href="/static/icons/sprite.svg#i-sun"></use></svg>
    </button>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="container">
  <div class="footer__row">
    <span id="health-badge"
          hx-get="/health/badge"
          hx-trigger="load, every 60s"
          hx-swap="innerHTML">…</span>
    <span style="margin-left:auto; color: var(--text-dim); font-family: var(--font-mono);">tuya-irrigation</span>
  </div>
</footer>

</body>
</html>
