{% extends "_base.html" %}
{% block title %}Log manual irrigation · {{ irrigator.name }}{% endblock %}
{% block content %}
<hgroup>
  <h1>Log manual irrigation</h1>
  <p>{{ irrigator.name }} — logs an event without triggering the device</p>
</hgroup>

<form method="post" action="/irrigators/{{ irrigator.id }}/log-manual">
  <label for="minutes">Duration (minutes)
    <input type="number" id="minutes" name="minutes" min="1" required>
  </label>
  <label for="notes">Notes <small>(optional)</small>
    <textarea id="notes" name="notes" rows="3"></textarea>
  </label>
  <button type="submit">Log event</button>
  <a href="/clusters/{{ irrigator.cluster_id }}/irrigators" role="button" class="secondary">Cancel</a>
</form>
{% endblock %}
