{% extends "_base.html" %}
{% block title %}Add irrigator · {{ cluster.name }}{% endblock %}
{% block content %}
<hgroup>
  <h1>Add irrigator</h1>
  <p>to cluster <a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></p>
</hgroup>

<form method="post" action="/clusters/{{ cluster.id }}/irrigators">
  <label for="tuya_device_id">Tuya device ID
    <input type="text" id="tuya_device_id" name="tuya_device_id" required>
  </label>
  <label for="name">Name
    <input type="text" id="name" name="name" placeholder="Pump A" required>
  </label>
  <label for="type">Type
    <select id="type" name="type" required>
      <option value="tuya_cloud" selected>tuya_cloud</option>
      <option value="tuya_local">tuya_local</option>
    </select>
  </label>
  <fieldset>
    <legend>Local protocol <small>(tuya_local only)</small></legend>
    <label for="device_ip">Device IP
      <input type="text" id="device_ip" name="device_ip" placeholder="192.168.1.42">
    </label>
    <label for="local_key">Local key
      <input type="text" id="local_key" name="local_key">
    </label>
  </fieldset>
  <button type="submit">Add irrigator</button>
  <a href="/clusters/{{ cluster.id }}/irrigators" role="button" class="secondary">Cancel</a>
</form>
{% endblock %}
