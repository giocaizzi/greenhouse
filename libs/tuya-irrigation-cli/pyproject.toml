[project]
name = "tuya-irrigation-cli"
version = "1.0.0"
description = "CLI client for tuya-irrigation server"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
tuya-irrigation = "tuya_irrigation_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tuya_irrigation_cli"]
