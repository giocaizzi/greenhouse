[project]
name = "greenhouse-core"
version = "3.1.1"
description = "Core library for greenhouse: models, repository, business logic"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "tinytuya>=1.14.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse_core"]
