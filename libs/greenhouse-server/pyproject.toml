[project]
name = "greenhouse-server"
version = "6.1.0"
description = "FastAPI server for greenhouse"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "greenhouse-core",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.4",
    "fastapi>=0.143.0",
    "starlette>=1.8",
    "uvicorn[standard]>=0.54.0",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "fastapi-mcp>=0.4",
    "pyjwt>=2.15.0",
]

[project.scripts]
greenhouse-server = "greenhouse_server.app:main"

[tool.deptry.per_rule_ignores]
# Never imported by name, still required at runtime: FastAPI's Jinja2Templates (web/templating.py)
# imports jinja2 lazily, and its Form(...) parameters (web/routes/*) need python-multipart.
DEP002 = ["jinja2", "python-multipart"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse_server"]
