[project]
name = "greenhouse-server"
version = "1.0.0"
description = "FastAPI server for greenhouse"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "greenhouse-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "fastapi-mcp>=0.4",
]

[project.scripts]
greenhouse-server = "greenhouse_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse_server"]
