{% extends "_base.html" %}
{% block title %}Edit vacation · Greenhouse{% endblock %}
{% block content %}

<div class="crumb">
  <a href="/">home</a><span class="sep">/</span>
  <a href="/vacation">vacation</a><span class="sep">/</span>
  <span class="here">edit</span>
</div>

<section class="page-head">
  <div class="page-head__title">
    <h1>Edit vacation</h1>
    <div class="page-head__meta">
      <span>Window #{{ window.id }}</span>
    </div>
  </div>
</section>

<article class="card form-card">
  <form method="post" action="/vacation/{{ window.id }}/edit">
    <div class="grid">
      <label for="starts_at">Start date
        <input type="date" id="starts_at" name="starts_at"
               value="{{ window.starts_at | format_ts('%Y-%m-%d') }}" required>
      </label>
      <label for="ends_at">End date
        <input type="date" id="ends_at" name="ends_at"
               value="{{ window.ends_at | format_ts('%Y-%m-%d') }}" required>
      </label>
    </div>
    <label for="contact_email">Contact email <small class="muted">(optional)</small>
      <input type="email" id="contact_email" name="contact_email"
             value="{{ window.contact_email or '' }}" placeholder="person@example.com">
    </label>
    <label for="notes">Notes <small class="muted">(optional)</small>
      <textarea id="notes" name="notes" placeholder="Trip notes…">{{ window.notes or '' }}</textarea>
    </label>
    <div class="form-actions">
      <a href="/vacation" class="btn secondary">Cancel</a>
      <button type="submit">Save changes</button>
    </div>
  </form>
</article>
{% endblock %}
