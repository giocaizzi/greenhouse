{% extends "_base.html" %}
{% block title %}New cluster · Greenhouse{% endblock %}
{% block content %}

<div class="crumb">
  <a href="/">home</a><span class="sep">/</span>
  <a href="/clusters">clusters</a><span class="sep">/</span>
  <span class="here">new</span>
</div>

<section class="page-head">
  <div class="page-head__title">
    <h1>New cluster</h1>
    <div class="page-head__meta">
      <span>Group plants, sensors, and irrigators together.</span>
    </div>
  </div>
</section>

<article class="card form-card">
  <form method="post" action="/clusters">
    <label for="name">Name
      <input type="text" id="name" name="name" placeholder="Living room" required autofocus>
    </label>
    <label for="location">Location <small class="muted">(optional)</small>
      <input type="text" id="location" name="location" placeholder="South window">
    </label>
    <label for="environment">Environment
      <select id="environment" name="environment" required>
        <option value="indoor" selected>Indoor</option>
        <option value="outdoor">Outdoor</option>
        <option value="greenhouse">Greenhouse</option>
      </select>
    </label>
    <div class="form-actions">
      <a href="/clusters" class="btn secondary">Cancel</a>
      <button type="submit">Create cluster</button>
    </div>
  </form>
</article>
{% endblock %}
