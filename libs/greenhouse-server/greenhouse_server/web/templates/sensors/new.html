{% extends "_base.html" %}
{% block title %}Add sensor · {{ cluster.name }}{% endblock %}
{% block content %}

<div class="crumb">
  <a href="/">home</a><span class="sep">/</span>
  <a href="/clusters">clusters</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}">{{ cluster.name | lower }}</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}/sensors">sensors</a><span class="sep">/</span>
  <span class="here">add</span>
</div>

<section class="page-head">
  <div class="page-head__title">
    <h1>Add sensor</h1>
    <div class="page-head__meta">
      <span>to <a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></span>
    </div>
  </div>
</section>

<article class="card form-card">
  <form method="post" action="/clusters/{{ cluster.id }}/sensors">
    <label for="tuya_device_id">Tuya device ID
      <input type="text" id="tuya_device_id" name="tuya_device_id" required autofocus>
      <small class="muted">From the Tuya/SmartLife app device info</small>
    </label>
    <label for="name">Name
      <input type="text" id="name" name="name" placeholder="Monstera moisture" required>
    </label>
    <label for="type">Type
      <select id="type" name="type" required>
        <option value="soil_moisture" selected>Soil moisture</option>
        <option value="temp_humidity">Temperature &amp; humidity</option>
        <option value="light">Light</option>
      </select>
    </label>
    <label for="plant_id">Plant <small class="muted">(optional)</small>
      <select id="plant_id" name="plant_id">
        <option value="">— none —</option>
        {% for plant in plants %}
          <option value="{{ plant.id }}">{{ plant.species }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions">
      <a href="/clusters/{{ cluster.id }}/sensors" class="btn secondary">Cancel</a>
      <button type="submit">Add sensor</button>
    </div>
  </form>
</article>
{% endblock %}
