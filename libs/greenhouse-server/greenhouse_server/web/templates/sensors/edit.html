{% extends "_base.html" %}
{% block title %}Edit {{ sensor.name }} · Greenhouse{% endblock %}
{% block content %}

<div class="crumb">
  <a href="/">home</a><span class="sep">/</span>
  <a href="/clusters">clusters</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}">{{ cluster.name | lower }}</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}/sensors">sensors</a><span class="sep">/</span>
  <span class="here">edit</span>
</div>

<section class="page-head">
  <div class="page-head__title">
    <h1>Edit sensor</h1>
    <div class="page-head__meta">
      <span>in <a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></span>
    </div>
  </div>
</section>

<article class="card form-card">
  <form method="post" action="/clusters/{{ cluster.id }}/sensors/{{ sensor.id }}/edit">
    <label>
      Tuya device ID
      <input type="text" value="{{ sensor.tuya_device_id }}" disabled>
      <small class="muted">Device id cannot be changed.</small>
    </label>
    <label for="name">Name
      <input type="text" id="name" name="name" value="{{ sensor.name }}" required autofocus>
    </label>
    <label for="type">Type
      <select id="type" name="type" required>
        <option value="soil_moisture"{% if sensor.type == "soil_moisture" %} selected{% endif %}>soil_moisture</option>
        <option value="temp_humidity"{% if sensor.type == "temp_humidity" %} selected{% endif %}>temp_humidity</option>
        <option value="light"{% if sensor.type == "light" %} selected{% endif %}>light</option>
      </select>
    </label>
    <label for="plant_id">Plant <small class="muted">(optional)</small>
      <select id="plant_id" name="plant_id">
        <option value="">— none —</option>
        {% for plant in plants %}
          <option value="{{ plant.id }}"{% if sensor.plant_id == plant.id %} selected{% endif %}>{{ plant.species }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions">
      <a href="/clusters/{{ cluster.id }}/sensors" class="btn secondary">Cancel</a>
      <button type="submit">Save changes</button>
    </div>
  </form>
</article>
{% endblock %}
