{% extends "_base.html" %}
{% block title %}Add plant · {{ cluster.name }}{% endblock %}
{% block content %}

<div class="crumb">
  <a href="/">home</a><span class="sep">/</span>
  <a href="/clusters">clusters</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}">{{ cluster.name | lower }}</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}/plants">plants</a><span class="sep">/</span>
  <span class="here">add</span>
</div>

<section class="page-head">
  <div class="page-head__title">
    <h1>Add plant</h1>
    <div class="page-head__meta">
      <span>to <a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></span>
    </div>
  </div>
</section>

<article class="card form-card">
  <form method="post" action="/clusters/{{ cluster.id }}/plants">
    <label for="species">Species
      <input type="text" id="species" name="species" placeholder="Monstera deliciosa" required autofocus>
      <small class="muted">Scientific name (Genus species)</small>
    </label>
    <div class="grid">
      <label for="category">Category
        <input type="text" id="category" name="category" placeholder="tropical">
      </label>
      <label for="water_needs">Water needs
        <select id="water_needs" name="water_needs">
          <option value="">—</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
      <label for="light_needs">Light needs
        <select id="light_needs" name="light_needs">
          <option value="">—</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </div>
    <fieldset>
      <legend>Ideal temperature (°C)</legend>
      <div class="grid">
        <label for="ideal_temp_min">Min <input type="number" step="0.1" id="ideal_temp_min" name="ideal_temp_min"></label>
        <label for="ideal_temp_max">Max <input type="number" step="0.1" id="ideal_temp_max" name="ideal_temp_max"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Ideal humidity (%)</legend>
      <div class="grid">
        <label for="ideal_humidity_min">Min <input type="number" step="1" id="ideal_humidity_min" name="ideal_humidity_min"></label>
        <label for="ideal_humidity_max">Max <input type="number" step="1" id="ideal_humidity_max" name="ideal_humidity_max"></label>
      </div>
    </fieldset>
    <label for="notes">Notes <small class="muted">(optional)</small>
      <textarea id="notes" name="notes" rows="3"></textarea>
    </label>
    <div class="form-actions">
      <a href="/clusters/{{ cluster.id }}/plants" class="btn secondary">Cancel</a>
      <button type="submit">Add plant</button>
    </div>
  </form>
</article>
{% endblock %}
