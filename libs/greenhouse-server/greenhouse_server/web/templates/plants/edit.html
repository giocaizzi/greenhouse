{% extends "_base.html" %}
{% block title %}Edit {{ plant.species }} · Greenhouse{% endblock %}
{% block content %}

<div class="crumb">
  <a href="/">home</a><span class="sep">/</span>
  <a href="/clusters">clusters</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}">{{ cluster.name | lower }}</a><span class="sep">/</span>
  <a href="/clusters/{{ cluster.id }}/plants">plants</a><span class="sep">/</span>
  <span class="here">edit</span>
</div>

<section class="page-head">
  <div class="page-head__title">
    <h1>Edit plant</h1>
    <div class="page-head__meta">
      <span>in <a href="/clusters/{{ cluster.id }}">{{ cluster.name }}</a></span>
    </div>
  </div>
</section>

<article class="card form-card">
  <form method="post" action="/clusters/{{ cluster.id }}/plants/{{ plant.id }}/edit">
    <label for="species">Species
      <input type="text" id="species" name="species" value="{{ plant.species }}" required autofocus>
    </label>
    <div class="grid">
      <label for="category">Category
        <input type="text" id="category" name="category" value="{{ plant.category or '' }}" placeholder="tropical">
      </label>
      <label for="water_needs">Water needs
        <select id="water_needs" name="water_needs">
          <option value=""{% if not plant.water_needs %} selected{% endif %}>—</option>
          <option value="low"{% if plant.water_needs == "low" %} selected{% endif %}>Low</option>
          <option value="medium"{% if plant.water_needs == "medium" %} selected{% endif %}>Medium</option>
          <option value="high"{% if plant.water_needs == "high" %} selected{% endif %}>High</option>
        </select>
      </label>
      <label for="light_needs">Light needs
        <select id="light_needs" name="light_needs">
          <option value=""{% if not plant.light_needs %} selected{% endif %}>—</option>
          <option value="low"{% if plant.light_needs == "low" %} selected{% endif %}>Low</option>
          <option value="medium"{% if plant.light_needs == "medium" %} selected{% endif %}>Medium</option>
          <option value="high"{% if plant.light_needs == "high" %} selected{% endif %}>High</option>
        </select>
      </label>
    </div>
    <fieldset>
      <legend>Ideal temperature (°C)</legend>
      <div class="grid">
        <label for="ideal_temp_min">Min <input type="number" step="0.1" id="ideal_temp_min" name="ideal_temp_min" value="{{ plant.ideal_temp_min if plant.ideal_temp_min is not none else '' }}"></label>
        <label for="ideal_temp_max">Max <input type="number" step="0.1" id="ideal_temp_max" name="ideal_temp_max" value="{{ plant.ideal_temp_max if plant.ideal_temp_max is not none else '' }}"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Ideal humidity (%)</legend>
      <div class="grid">
        <label for="ideal_humidity_min">Min <input type="number" step="1" id="ideal_humidity_min" name="ideal_humidity_min" value="{{ plant.ideal_humidity_min if plant.ideal_humidity_min is not none else '' }}"></label>
        <label for="ideal_humidity_max">Max <input type="number" step="1" id="ideal_humidity_max" name="ideal_humidity_max" value="{{ plant.ideal_humidity_max if plant.ideal_humidity_max is not none else '' }}"></label>
      </div>
    </fieldset>
    <label for="notes">Notes <small class="muted">(optional)</small>
      <textarea id="notes" name="notes" rows="3">{{ plant.notes or '' }}</textarea>
    </label>
    <div class="form-actions">
      <a href="/clusters/{{ cluster.id }}/plants" class="btn secondary">Cancel</a>
      <button type="submit">Save changes</button>
    </div>
  </form>
</article>
{% endblock %}
