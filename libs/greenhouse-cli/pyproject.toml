[project]
name = "greenhouse-cli"
version = "5.0.0"
description = "CLI client for greenhouse server"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "typer>=0.26.8",
]

[project.scripts]
greenhouse = "greenhouse_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse_cli"]
