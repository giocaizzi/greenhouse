[project]
name = "greenhouse-cli"
version = "5.1.0"
description = "CLI and TUI client for greenhouse server"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "textual>=3.0",
    "textual-plotext>=1.0",
    "typer>=0.27.1",
]

[project.scripts]
greenhouse = "greenhouse_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhouse_cli"]
